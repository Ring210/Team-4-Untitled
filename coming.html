<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>先生詳細（視認性向上・旧スタイル統合）</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans JP", sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: #ffffff;
        position: relative;
      }

      /* Ripple Effect Background */
      .ripple-background {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        z-index: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(0, 209, 178, 0.1);
        animation: ripple 4s infinite cubic-bezier(0.65, 0, 0.34, 1);
        opacity: 0;
      }
      .circle:nth-child(1) {
        width: 20vw;
        height: 20vw;
        animation-delay: 0s;
      }
      .circle:nth-child(2) {
        width: 40vw;
        height: 40vw;
        animation-delay: 1s;
      }
      .circle:nth-child(3) {
        width: 60vw;
        height: 60vw;
        animation-delay: 2s;
      }
      .circle:nth-child(4) {
        width: 80vw;
        height: 80vw;
        animation-delay: 3s;
      }

      @keyframes ripple {
        0% {
          transform: scale(0.5);
          opacity: 0.8;
        }
        100% {
          transform: scale(3);
          opacity: 0;
        }
      }

      /* Confetti Canvas */
      #confetti-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        position: relative;
      }

      .status-card {
        background: white;
        border-radius: 24px;
        padding: 4rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 800px;
        width: 90%;
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .icon-svg {
        width: 2rem;
        height: 2rem;
      }

      .teacher-icon {
        width: 120px;
        height: 120px;
        background-color: #00d1b2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        color: white;
        box-shadow: 0 10px 20px rgba(0, 209, 178, 0.3);
      }
      .teacher-icon svg {
        width: 60px;
        height: 60px;
      }
    </style>
  </head>
  <body>
    <!-- Background Effects -->
    <div class="ripple-background">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <canvas id="confetti-canvas"></canvas>
    <!-- BEGIN: Header -->
    <header
      class="level px-5 py-3 has-background-white-bis mb-0"
      style="border-bottom: 1px solid #dbdbdb; z-index: 10; position: relative"
    >
      <div class="level-left"></div>
      <div class="level-right">
        <div class="is-size-5 has-text-weight-medium has-text-grey-dark">
          9:41AM
        </div>
      </div>
    </header>
    <!-- END: Header -->
    <!-- BEGIN: MainContent -->
    <main class="main-wrapper">
      <div class="status-card">
        <div class="teacher-icon">
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M13 10V3L4 14h7v7l9-11h-7z"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            ></path>
          </svg>
        </div>
        <h1
          class="title is-1 mb-4 has-text-black"
          style="font-size: 3rem; font-weight: 700; line-height: 1.3"
        >
          田中先生が<br />こちらに向かっています！
        </h1>
        <p class="subtitle is-3 has-text-grey mt-4 mb-6">
          そのまま席でお待ちください。
        </p>
        <button
          class="button is-light is-large is-rounded has-text-weight-bold px-6 mt-4"
          style="height: 4rem; font-size: 1.5rem"
          onclick="document.location.href = 'index.html'"
        >
          <span class="icon mr-2">
            <svg
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
              ></path>
            </svg>
          </span>
          <span>ホームに戻る</span>
        </button>
      </div>
    </main>
    <!-- END: MainContent -->
    <script>
      // Confetti Animation Logic
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      const colors = ["#00d1b2", "#ffdd57", "#ff3860", "#3273dc", "#48c774"];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height - canvas.height;
          this.size = Math.random() * 10 + 5;
          this.speedY = Math.random() * 3 + 2;
          this.speedX = Math.random() * 2 - 1;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.rotation = Math.random() * 360;
          this.rotationSpeed = Math.random() * 5 - 2.5;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          this.rotation += this.rotationSpeed;
          if (this.y > canvas.height) {
            this.y = -10;
            this.x = Math.random() * canvas.width;
          }
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
          ctx.restore();
        }
      }

      function initConfetti() {
        for (let i = 0; i < 100; i++) {
          particles.push(new Particle());
        }
      }

      function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animateConfetti);
      }

      initConfetti();
      animateConfetti();
    </script>
  </body>
</html>
