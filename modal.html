<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Call Confirmation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-primary": "#44ddc1",
              "tertiary-fixed-dim": "#ffb4a1",
              "error-container": "#ffdad6",
              "surface-container-high": "#e3eae6",
              "primary-container": "#00bfa5",
              "on-error-container": "#93000a",
              outline: "#6c7a76",
              "on-primary-fixed-variant": "#005145",
              "surface-variant": "#dde4e0",
              "outline-variant": "#bbcac4",
              "on-primary-container": "#00473c",
              "on-surface-variant": "#3c4a46",
              "surface-bright": "#f4fbf7",
              tertiary: "#9f4128",
              "on-secondary-container": "#00355c",
              "on-primary-fixed": "#00201a",
              "secondary-fixed": "#d1e4ff",
              "on-secondary-fixed": "#001d36",
              primary: "#006b5c",
              "on-secondary-fixed-variant": "#00497d",
              "on-tertiary-fixed": "#3c0800",
              "inverse-surface": "#2b3230",
              "on-tertiary-fixed-variant": "#7f2a13",
              "surface-container": "#e8efec",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "on-tertiary-container": "#74220b",
              "surface-dim": "#d4dcd8",
              "surface-container-low": "#eef5f1",
              "secondary-fixed-dim": "#9ecaff",
              "surface-container-highest": "#dde4e0",
              error: "#ba1a1a",
              "on-error": "#ffffff",
              "on-background": "#161d1b",
              "tertiary-container": "#fe896a",
              "on-primary": "#ffffff",
              "on-surface": "#161d1b",
              surface: "#f4fbf7",
              "on-secondary": "#ffffff",
              "inverse-on-surface": "#ebf2ef",
              "primary-fixed": "#68fadd",
              "primary-fixed-dim": "#44ddc1",
              "tertiary-fixed": "#ffdbd2",
              "surface-tint": "#006b5c",
              "secondary-container": "#33a0fd",
              background: "#f4fbf7",
              secondary: "#0061a4",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              gutter: "16px",
              "card-padding": "20px",
              "margin-mobile": "16px",
              unit: "8px",
              "margin-desktop": "32px",
            },
            fontFamily: {
              "headline-lg-mobile": ["Noto Sans JP"],
              "label-lg": ["Noto Sans JP"],
              "headline-sm": ["Noto Sans JP"],
              "body-md": ["Noto Sans JP"],
              "label-sm": ["Noto Sans JP"],
              "headline-md": ["Noto Sans JP"],
              "headline-lg": ["Noto Sans JP"],
              "body-lg": ["Noto Sans JP"],
            },
            fontSize: {
              "headline-lg-mobile": [
                "24px",
                {
                  lineHeight: "1.3",
                  fontWeight: "700",
                },
              ],
              "label-lg": [
                "14px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "headline-sm": [
                "20px",
                {
                  lineHeight: "1.5",
                  fontWeight: "500",
                },
              ],
              "body-md": [
                "16px",
                {
                  lineHeight: "1.6",
                  fontWeight: "400",
                },
              ],
              "label-sm": [
                "12px",
                {
                  lineHeight: "1.2",
                  fontWeight: "500",
                },
              ],
              "headline-md": [
                "24px",
                {
                  lineHeight: "1.4",
                  fontWeight: "700",
                },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "1.4",
                  fontWeight: "700",
                },
              ],
              "body-lg": [
                "18px",
                {
                  lineHeight: "1.6",
                  fontWeight: "400",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface min-h-screen relative overflow-hidden font-body-md text-body-md antialiased"
  >
    <!-- Blurred/Dimmed Background Context (Simulated Profile Screen) -->
    <div
      class="absolute inset-0 z-0 bg-surface blur-sm opacity-50 flex flex-col pointer-events-none"
    >
      <!-- Mock TopAppBar -->
      <header
        class="flex justify-between items-center w-full px-margin-desktop h-16 bg-surface border-b border-outline-variant"
      >
        <div
          class="font-headline-md text-headline-md font-bold text-on-surface"
        >
          FacultyLink
        </div>
        <div class="flex gap-4">
          <span class="material-symbols-outlined text-on-surface-variant"
            >schedule</span
          >
          <span class="material-symbols-outlined text-on-surface-variant"
            >notifications</span
          >
        </div>
      </header>
      <!-- Mock Content -->
      <main class="p-margin-desktop flex-1">
        <div class="max-w-2xl mx-auto space-y-gutter">
          <div class="flex items-center gap-gutter">
            <div
              class="w-24 h-24 rounded-full bg-surface-container-high border border-outline-variant"
            ></div>
            <div>
              <div
                class="w-48 h-8 bg-surface-container-high rounded mb-2"
              ></div>
              <div class="w-32 h-4 bg-surface-container-low rounded"></div>
            </div>
          </div>
          <div
            class="w-full h-32 bg-surface-container-low rounded border border-outline-variant mt-margin-desktop"
          ></div>
          <div
            class="w-full h-64 bg-surface-container-low rounded border border-outline-variant mt-gutter"
          ></div>
        </div>
      </main>
    </div>
    <!-- Modal Overlay -->
    <div class="modal is-active" style="z-index: 50">
      <div
        class="modal-background bg-inverse-surface/60 backdrop-blur-sm"
      ></div>
      <div
        class="modal-content px-margin-mobile flex items-center justify-center min-h-screen"
      >
        <!-- Modal Dialog -->
        <div
          class="bg-surface-container-lowest rounded-xl w-full max-w-sm shadow-xl flex flex-col items-center text-center overflow-hidden border border-outline-variant"
        >
          <div class="p-card-padding w-full">
            <!-- Icon container -->
            <div
              class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mx-auto mb-gutter text-primary"
            >
              <span
                class="material-symbols-outlined text-4xl"
                data-weight="fill"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >notifications_active</span
              >
            </div>
            <h2
              class="font-headline-sm text-headline-sm text-on-surface mb-unit"
            >
              田中先生を呼びますか？
            </h2>
            <p class="font-body-md text-body-md text-on-surface-variant">
              先生のデバイスに通知を送信します。音声通話は開始されません。
            </p>
          </div>
          <!-- Actions -->
          <div
            class="w-full border-t border-outline-variant flex flex-col sm:flex-row bg-surface-container-low/50"
          >
            <button
              class="flex-1 py-4 px-6 font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80"
              style="border: none; background: transparent; cursor: pointer"
              onclick="document.location.href = 'teacher-card.html'"
              type="button"
            >
              キャンセル
            </button>
            <div class="hidden sm:block w-px bg-outline-variant"></div>
            <div class="sm:hidden h-px w-full bg-outline-variant"></div>
            <a
              class="flex-1 py-4 px-6 font-label-lg text-label-lg font-bold text-primary-container bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:opacity-80 flex items-center justify-center gap-2"
              href="coming.html"
              style="text-decoration: none"
              ><span class="material-symbols-outlined text-xl">send</span
              >通知を送る</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
